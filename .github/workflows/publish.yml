name: Publish images
run-name: "Publish: ${{ inputs.image }}"

on:
  workflow_dispatch:
    inputs:
      image:
        description: Image to publish
        type: choice
        default: all
        # workflow_dispatch choices are static; add new image dirs here too.
        options:
          - all
          - playwright
          - playwright-firebase

permissions:
  contents: read
  packages: write

jobs:
  list:
    name: list images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          # block mode drops disallowed packets instead of failing fast,
          # which hangs actions/checkout@v7 past the job timeout rather
          # than erroring, so this job is monitored, not blocked.
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v7

      - name: List image directories
        id: list
        env:
          SELECTED_IMAGE: ${{ inputs.image }}
        run: |
          if [ -n "$SELECTED_IMAGE" ] && [ "$SELECTED_IMAGE" != "all" ]; then
            matrix=$(jq -R -s -c 'split("\n") | map(select(length > 0))' <<< "$SELECTED_IMAGE")
          else
            matrix=$(find images -maxdepth 1 -mindepth 1 -type d -printf '%f\n' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  publish:
    name: build and push
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        image: ${{ fromJson(needs.list.outputs.matrix) }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          # mcr.microsoft.com redirects blob pulls to a region-specific CDN
          # host (e.g. eastus.data.mcr.microsoft.com) that harden-runner
          # can't allowlist exactly, so this job is monitored, not blocked.
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Read image version
        id: version
        run: echo "version=$(cat images/${{ matrix.image }}/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read image description
        id: image-meta
        run: |
          description=$(sed -n 's/^LABEL org\.opencontainers\.image\.description="\(.*\)"$/\1/p' "images/${{ matrix.image }}/Dockerfile")
          echo "description=$description" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        env:
          # metadata-action defaults to annotating only the per-platform
          # manifests; GHCR's package page reads the index annotations,
          # which are otherwise left empty.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/aglflorida/ci-${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=ci-${{ matrix.image }}
            org.opencontainers.image.description=${{ steps.image-meta.outputs.description }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: images/${{ matrix.image }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  cleanup:
    name: prune old versions (${{ matrix.image }})
    needs: [list, publish]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      packages: write
    strategy:
      matrix:
        image: ${{ fromJson(needs.list.outputs.matrix) }}
    steps:
      - name: Keep latest 5 versions
        # actions/delete-package-versions is unmaintained (last release
        # v5.0.0, Jan 2024) and still declares `using: node20`, which
        # runners now flag as deprecated. Community fixes sit unmerged
        # upstream, so there is nothing to bump to - inline the same
        # "keep N newest untagged versions" behavior via the API instead.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: ci-${{ matrix.image }}
          KEEP: 5
        run: |
          set -euo pipefail
          mapfile -t ids < <(gh api --paginate \
            "/orgs/AGLFlorida/packages/container/${PACKAGE_NAME}/versions?per_page=100" \
            | jq -r --argjson keep "${KEEP}" '
              [.[] | select((.metadata.container.tags // []) | length == 0)]
              | sort_by(.created_at) | reverse | .[$keep:] | .[:50] | .[].id')
          for id in "${ids[@]}"; do
            gh api --method DELETE \
              "/orgs/AGLFlorida/packages/container/${PACKAGE_NAME}/versions/${id}" \
              || echo "warn: could not delete version ${id}"
          done
