name: Publish images
run-name: "Publish: ${{ inputs.image }}"

on:
  workflow_dispatch:
    inputs:
      image:
        description: Image to publish
        type: choice
        default: all
        # workflow_dispatch choices are static; add new image dirs here too.
        options:
          - all
          - playwright

permissions:
  contents: read
  packages: write

jobs:
  list:
    name: list images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          # block mode drops disallowed packets instead of failing fast,
          # which hangs actions/checkout@v7 past the job timeout rather
          # than erroring, so this job is monitored, not blocked.
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v7

      - name: List image directories
        id: list
        env:
          SELECTED_IMAGE: ${{ inputs.image }}
        run: |
          if [ -n "$SELECTED_IMAGE" ] && [ "$SELECTED_IMAGE" != "all" ]; then
            matrix=$(jq -R -s -c 'split("\n") | map(select(length > 0))' <<< "$SELECTED_IMAGE")
          else
            matrix=$(find images -maxdepth 1 -mindepth 1 -type d -printf '%f\n' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  publish:
    name: build and push
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        image: ${{ fromJson(needs.list.outputs.matrix) }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          # mcr.microsoft.com redirects blob pulls to a region-specific CDN
          # host (e.g. eastus.data.mcr.microsoft.com) that harden-runner
          # can't allowlist exactly, so this job is monitored, not blocked.
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Read image version
        id: version
        run: echo "version=$(cat images/${{ matrix.image }}/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: images/${{ matrix.image }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/aglflorida/ci-${{ matrix.image }}:${{ steps.version.outputs.version }}
            ghcr.io/aglflorida/ci-${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
