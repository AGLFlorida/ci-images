name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  list:
    name: list images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            uploads.github.com:443

      - name: Checkout code
        uses: actions/checkout@v7

      - name: List image directories
        id: list
        run: |
          matrix=$(find images -maxdepth 1 -mindepth 1 -type d -printf '%f\n' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  hadolint:
    name: hadolint (${{ matrix.image }})
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        image: ${{ fromJson(needs.list.outputs.matrix) }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            uploads.github.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: images/${{ matrix.image }}/Dockerfile

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            uploads.github.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Lint workflows
        uses: reviewdog/action-actionlint@v1.80.6
        with:
          reporter: github-check

  trivy:
    name: trivy (${{ matrix.image }})
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        image: ${{ fromJson(needs.list.outputs.matrix) }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          # mcr.microsoft.com redirects blob pulls to a region-specific CDN
          # host (e.g. eastus.data.mcr.microsoft.com) that harden-runner
          # can't allowlist exactly, so this job is monitored, not blocked.
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Read image version
        id: version
        run: echo "version=$(cat images/${{ matrix.image }}/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (local only)
        uses: docker/build-push-action@v7
        with:
          context: images/${{ matrix.image }}
          push: false
          load: true
          tags: ci-${{ matrix.image }}:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DISABLE_VEX_NOTICE: true
        with:
          image-ref: ci-${{ matrix.image }}:${{ steps.version.outputs.version }}
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
